            {"datasetrec":{"DasID":8636,"Acronym":"Eel_migration_Test_2023","StandardTitle":"Acoustic telemetry data for European eel (<i>Anguilla anguilla</i>) in the River Test","OrigTitle":null,"OrigTitleLangID":null,"OrigTitleLangCode":null,"OrigTitleLang":null,"OrigTitleLangNL":null,"VersionName":null,"ContactEmail":null,"VersionDate":null,"VersionDay":null,"VersionMonth":null,"VersionYear":null,"SizeReference":null,"EngAbstract":"<p>The status of the European eel (<i>Anguilla anguilla</i>) is of great concern, with the latest advice from the International Council for the Exploration of the Seas emphasizing there should be no fisheries or non-fisheries mortalities in 2024. The Eel Regulation requires countries to implement eel management plans to assess eel production from national waters and human factors limiting that production, and take actions to increase the biomass of eels leaving national waters on their way to spawn. Therefore, losses of eel in rivers, estuaries, and coastal waters will be assessed using a telemetry study that draws from other telemetry infrastructures in estuary and at sea. Eels will be tagged with acoustic tags incorporating temperature and depth sensors which will allow for silver eel migration duration, speed and depth use to be identified across different habitats.</p><p>Receiver array data is available via the European Tracing Network Data Explorer.</p>","EngDescr":null,"OrigAbstract":null,"OrigDescr":null,"Comments":null,"ReleaseDate":null,"ReleaseDate0":null,"OrigDescrLang":null,"EmbargoDate":null,"OrigDescrLangNL":null,"OrigLangCode":null,"OrigLangCodeExtended":null,"OrigLangID":null,"DescrCompFlag":null,"DescrTransFlag":null,"Citation":"Basic T., Moore, A., Ives, M., et al., (2024): Eel_migration_Test_2023 - Acoustic telemetry data for European eel (Anguilla anguilla) in the River Test","AccessConstraints":null,"UDate":"2026-07-30","CDate":"2024-08-27","CurrencyDate":null,"RevisionDate":null,"DateLastModified":{"date":"2026-0