            {"datasetrec":{"DasID":7929,"Acronym":"SGB","StandardTitle":"Ocean Tracking Network Strait of Gibraltar Line","OrigTitle":null,"OrigTitleLangID":null,"OrigTitleLangCode":null,"OrigTitleLang":null,"OrigTitleLangNL":null,"VersionName":null,"ContactEmail":null,"VersionDate":null,"VersionDay":null,"VersionMonth":null,"VersionYear":null,"SizeReference":null,"EngAbstract":"The Mediterranean is one of the economically most important seas in the  world and its only natural entrance is the Strait of Gibraltar. All sea life and commerce passes through this 14-km wide passage. The currents can be very variable under  the influence of winds and tides and regulate the movements of both commercial and conservation species. The Gibraltar Line is ideally  suited to monitor and understand all of these phenomena. It is deep enough to avoid interference from commercial traffic and operates as a continuous ocean observation system to detect rare events, both  oceanographic and biological. There are plans to monitor species including iconic  whales, turtles, and tuna, as well as commercial bream, cuttlefish,  octopus, squid, and eels. This is a  perfect opportunity for OTN to provide high-quality information to its  partners and influence international policy.","EngDescr":"The Mediterranean is one of the economically most important seas in the world and its only natural entrance is the Strait of Gibraltar. All sea life and commerce passes through this 14-km wide passage and the high evaporation rate causes dense highly saline water to form and sink inside. This leads to surface inflow from the North Atlantic and bottom outflow of western Mediterranean deep water that flows into the Atlantic and affects the deep ocean thermohaline circulation called the global \"air conditioner\". This system is vulnerable to climate change and may have positive feedback effects. The currents can be very variable under the influence of winds and tides and regulate the movements of both commercial and conservation species. The Gibraltar Line is ideally suited to monitor and understand all of these phenomena. It is deep enough to avoid interference from commercial traffic and operates as a continuous ocean observation system to detect rare events, both oceanographic and biological. It complements satellite observations of surface waters. There are plans to monitor species including iconic whales, turtles, and tuna, as well as commercial bream, cuttlefish, octopus, squid, and eels. The Line itself has been carefully surveyed and will require 26 km of equipment to avoid excessive depths and currents as well as trawlable bottom. The highest profile species is the bluefin tuna, which can sell for over $100,000 each and were recently proposed and denied CITES status after years of overfishing. This is a perfect opportunity for OTN to provide high-quality information to its partners and influence international policy.","OrigAbstract":null,"OrigDescr":null,"Comments":null,"ReleaseDate":null,"ReleaseDate0":null,"OrigDescrLang":null,"EmbargoDate":null,"OrigDescrLangNL":null,"OrigLangCode":null,"OrigLangCodeExtended":null,"OrigLangID":null,"DescrCompFlag":0,"DescrTransFlag":0,"Citation":"Canals, M., Sanchez Vidal, A., Calafat, A.M., Rivera, J. 2012. Ocean Tracking Network Strait of Gibraltar Line Metadata and Data  Set.","AccessConstraints":null,"UDate":"2024-08-05","CDate":"2021-12-02","CurrencyDate":null,"RevisionDate":null,"DateLastModified":{"date":"2026-09-19 01:45:00.843981","timezone_type":1,"timezone":"+02:00"},"CheckedFlag":0,"PublicFlag":1,"VlizCoreFlag":1,"MarineFlag":1,"FreshFlag":0,"BrackishFlag":0,"TerrestrialFlag":0,"StatusID":1,"DasType":"Data","DasTypeID":1,"DasOrigin":"Research: field survey","Progress":"In Progress","AccessConstraint":"Attribution (CC BY)","AccConstrEN":"Attribution (CC BY)","AccConstrDisplay":"<a rel=\"license\" href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\"><img alt=\"Creative Commons License\" style=\"