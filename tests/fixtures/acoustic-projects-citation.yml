            {"datasetrec":{"DasID":6536,"Acronym":"rt2020_zeeschelde","StandardTitle":"Acoustic telemetry range test in the Zeeschelde, Belgium","OrigTitle":null,"OrigTitleLangID":null,"OrigTitleLangCode":null,"OrigTitleLang":null,"OrigTitleLangNL":null,"VersionName":null,"ContactEmail":null,"VersionDate":null,"VersionDay":null,"VersionMonth":null,"VersionYear":null,"SizeReference":null,"EngAbstract":"In the Zeeschelde (Belgium), a highly dynamic estuary, a range test was performed with eight acoustic receivers, each containing a built-in transmitter. The receivers were placed at 50 m, 200 m, 300 m, 400 m, 500 m, 600 m and 1000 m from the starting receiver, leading to various inter-receiver distances. The study took place for 10 weeks in spring 2020. Receivers were moored on the bottom with a concrete block to keep them at a fixed position. A bouy held them upright in the water but prone to tilt due to changing water currents.","EngDescr":null,"OrigAbstract":null,"OrigDescr":null,"Comments":null,"ReleaseDate":null,"ReleaseDate0":null,"OrigDescrLang":null,"EmbargoDate":null,"OrigDescrLangNL":null,"OrigLangCode":null,"OrigLangCodeExtended":null,"OrigLangID":null,"DescrCompFlag":0,"DescrTransFlag":0,"Citation":"Verhelst, P., Coeck, J., Reubens, J. (2020). Acoustic telemetry range test in the Zeeschelde, Belgium","AccessConstraints":null,"UDate":"2026-07-30","CDate":"2020-07-17","CurrencyDate":null,"RevisionDate":null,"DateLastModified":{"date":"2026-09-19 01:45:00.843981","timezone_type":1,"timezone":"+02:00"},"CheckedFlag":0,"PublicFlag":1,"VlizCoreFlag":1,"MarineFlag":1,"FreshFlag":0,"BrackishFlag":1,"TerrestrialFlag":0,"StatusID":1,"DasType":"Data","DasTypeID":1,"DasOrigin":"Research: field experiment","Progress":"Completed","AccessConstraint":"Attribution (CC BY)","AccConstrEN":"Attribution (CC BY)","AccConstrDisplay":"<a rel=\"license\" href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\"><img alt=\"Creative Commons License\" style=\"border:0px;