            {"datasetrec":{"DasID":5932,"Acronym":"ARAISOLA03","StandardTitle":"Homing and home range of wild spiny lobsters in Western Mediterranean Sea","OrigTitle":null,"OrigTitleLangID":null,"OrigTitleLangCode":null,"OrigTitleLang":null,"OrigTitleLangNL":null,"VersionName":null,"ContactEmail":null,"VersionDate":null,"VersionDay":null,"VersionMonth":null,"VersionYear":null,"SizeReference":null,"EngAbstract":"A specific study has been carried out for the first time in the Capo Gallo - Isola delle Femmine MPA (Sicily, western Mediterranean) to investigate the homing capability and daily home range of wild P. elephas by means of ultrasonic telemetry. Lobster movements were monitored using an array of 15 automated receivers with the main purpose of:  (i) calculate the horizontal and vertical positions of lobsters through time, (ii) analyze movement patterns to evaluate their homing behavior and (iii) calculate their daily home range (minimum convex polygon, MCP 100%).","EngDescr":null,"OrigAbstract":null,"OrigDescr":null,"Comments":null,"ReleaseDate":null,"ReleaseDate0":null,"OrigDescrLang":null,"EmbargoDate":null,"OrigDescrLangNL":null,"OrigLangCode":null,"OrigLangCodeExtended":null,"OrigLangID":null,"DescrCompFlag":0,"DescrTransFlag":0,"Citation":"Giacalone V.M., D'Anna G., Badalamenti F., Pipitone C., (2017) ARAISOLA03","AccessConstraints":null,"UDate":"2018-05-08","CDate":"2018-05-08","CurrencyDate":null,"RevisionDate":null,"DateLastModified":{"date":"2026-08-15 01:43:57.257074","timezone_type":1,"timezone":"+02:00"},"CheckedFlag":1,"PublicFlag":1,"VlizCoreFlag":1,"MarineFlag":1,"FreshFlag":0,"BrackishFlag":0,"TerrestrialFlag":0,"StatusID":1,"DasType":"Data","DasTypeID":1,"DasOrigin":"Monitoring: field survey","Progress":"Completed","AccessConstraint":"Attribution (CC BY)","AccConstrEN":"Attribution (CC BY)","AccConstrDisplay":"<a rel=\"license\" href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\"><img alt=\"Creative Commons License\" style=\"